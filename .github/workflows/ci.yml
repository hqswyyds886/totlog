name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python tests/test_totlog.py

      - name: Smoke test on synthetic log
        shell: bash
        run: |
          python src/totlog.py report -f tests/fixtures/sample.log
          python src/totlog.py sessions -f tests/fixtures/sample.log
          python src/totlog.py report -f tests/fixtures/sample.log \
            --json out/ci.json --md out/ci.md
          test -s out/ci.json
          test -s out/ci.md

      - name: Verify no leaked user path in export
        shell: bash
        run: |
          if grep -qE 'Users[\\/](?!x)' out/ci.json 2>/dev/null; then
            echo "::error::导出里出现了疑似用户路径"
            exit 1
          fi
          echo "ok"
