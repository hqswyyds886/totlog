name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python tests/test_totlog.py

      - name: Smoke test on synthetic log
        shell: bash
        run: |
          python src/totlog.py report -f tests/fixtures/sample.log
          python src/totlog.py sessions -f tests/fixtures/sample.log
          python src/totlog.py report -f tests/fixtures/sample.log \
            --json out/ci.json --md out/ci.md
          test -s out/ci.json
          test -s out/ci.md

      - name: Verify no leaked user path in export
        shell: bash
        run: |
          # 导出里只应出现 %USERPROFILE% 这类占位符。
          # 允许 sample.log 里虚构的相对名，不允许真实绝对路径。
          if grep -Eq '(/Users/[^%]|/home/[^%]|[A-Za-z]:\\\\?Users\\\\?[A-Za-z0-9])' out/ci.json; then
            echo "::error::导出里出现了疑似真实用户路径"
            grep -Eo '(/Users/[^"]*|/home/[^"]*|[A-Za-z]:\\\\?Users\\\\?[^"]*)' out/ci.json | head -5
            exit 1
          fi
          echo "ok: 无真实路径泄露"
